<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №1 - Форма</title>
    <link rel="stylesheet" href="../css/style.css"> 
</head>
<body>
    <header>
        <h1>Лабораторна робота №1</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Повернутися на Головну</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h2>Реєстрація</h2>
            
            <!-- заміни посилання в action на webhook -->
            <form action="https://webhook.site/%7B%7B%20getUrl()%20%7D%7D" method="POST" class="rpg-form">
                
                <div class="form-group">
                    <label for="username">Ім'я:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="surname">Прізвище:</label>
                    <input type="text" id="surname" name="surname" required>
                </div>

                <div class="form-group">
                    <label for="email">Електронна пошта:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="password_confirm">Підтвердження паролю:</label>
                    <input type="password" id="password_confirm" name="password_confirm" required>
                </div>

                
                <div class="form-group">
                    <label for="birthdate">Дата народження:</label>
                    <input type="date" id="birthdate" name="birthdate">
                </div>

                <div class="form-group">
                    <label for="gender">Стать:</label>
                    <select id="gender" name="gender">
                        <option value="male">Чоловіча</option>
                        <option value="female">Жіноча</option>
                        <option value="other">Інше</option>
                    </select>
                </div>

                <div class="form-group">
                    <input type="submit" value="Відправити дані">
                </div>
            </form>
        </section>
    </main>
</body>
</html>
