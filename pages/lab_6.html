<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №6 - Hawlucha</title>
    <link rel="stylesheet" href="../css/style.css"> 
    <style>
        .animation-scene {
            position: relative;
            width: 100%;
            height: 500px;
            border: 2px solid #8b0000;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            animation: timeOfDay 15s infinite alternate ease-in-out;
        }

        @keyframes timeOfDay {
            0% { background: linear-gradient(to bottom, #87CEEB, #E0F6FF); }
            50% { background: linear-gradient(to bottom, #ff9a44, #fc6076); }
            100% { background: linear-gradient(to bottom, #141e30, #243b55); }
        }

        .celestial-body {
            position: absolute;
            top: 15%;
            left: 20%;
            width: 70px;
            height: 70px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 50px #FFD700;
            animation: celestialMove 15s infinite alternate ease-in-out;
        }

        @keyframes celestialMove {
            0% { background: #FFD700; box-shadow: 0 0 50px #FFD700; transform: translateY(0); }
            100% { background: #e0e0e0; box-shadow: 0 0 20px #ffffff; transform: translateY(100px) scale(0.8); }
        }

        .mountains {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><polygon fill="%231a1a2e" points="0,100 0,60 15,30 35,70 60,20 85,60 100,40 100,100"/></svg>') no-repeat center bottom;
            background-size: 100% 100%;
            opacity: 0.5;
        }

        .clouds-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            pointer-events: none;
        }

        .clouds-back {
            background: 
                url('data:image/svg+xml;utf8,<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M50 50 Q60 30 80 50 Q100 40 110 60 Q130 60 120 80 Q100 90 80 80 Q60 90 40 80 Q20 80 30 60 Q20 40 50 50 Z" fill="rgba(255,255,255,0.3)"/></svg>') repeat-x 0 10%,
                url('data:image/svg+xml;utf8,<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M50 50 Q60 30 80 50 Q100 40 110 60 Q130 60 120 80 Q100 90 80 80 Q60 90 40 80 Q20 80 30 60 Q20 40 50 50 Z" fill="rgba(255,255,255,0.2)"/></svg>') repeat-x 50px 40%,
                url('data:image/svg+xml;utf8,<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M50 50 Q60 30 80 50 Q100 40 110 60 Q130 60 120 80 Q100 90 80 80 Q60 90 40 80 Q20 80 30 60 Q20 40 50 50 Z" fill="rgba(255,255,255,0.1)"/></svg>') repeat-x -30px 70%;
            background-size: 100px 50px;
            animation: moveClouds 25s linear infinite;
        }

        .clouds-front {
            background: 
                url('data:image/svg+xml;utf8,<svg width="250" height="120" xmlns="http://www.w3.org/2000/svg"><path d="M50 50 Q60 30 80 50 Q100 40 110 60 Q130 60 120 80 Q100 90 80 80 Q60 90 40 80 Q20 80 30 60 Q20 40 50 50 Z" fill="rgba(255,255,255,0.7)"/></svg>') repeat-x 0 20%,
                url('data:image/svg+xml;utf8,<svg width="250" height="120" xmlns="http://www.w3.org/2000/svg"><path d="M50 50 Q60 30 80 50 Q100 40 110 60 Q130 60 120 80 Q100 90 80 80 Q60 90 40 80 Q20 80 30 60 Q20 40 50 50 Z" fill="rgba(255,255,255,0.5)"/></svg>') repeat-x 80px 60%;
            background-size: 140px 70px;
            animation: moveClouds 12s linear infinite;
        }

        @keyframes moveClouds {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        .pokemon-diving {
            position: absolute;
            width: 160px; 
            height: 160px;
            background-image: url('../img/pokemon.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: diveAttack 3s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
            z-index: 10;
        }

        @keyframes diveAttack {
            0% { 
                left: 110%; 
                top: -20%; 
                transform: rotate(-25deg) scale(0.3); 
                opacity: 0;
            }
            10% { opacity: 1; }
            80% { 
                left: 10%;
                top: 60%;
                transform: rotate(-45deg) scale(1.5); 
                opacity: 1;
            }
            100% { 
                left: -40%; 
                top: 140%; 
                transform: rotate(-65deg) scale(4.5); 
                opacity: 1;
            }
        }

        .speed-lines {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                -45deg, 
                transparent, 
                transparent 150px, 
                rgba(255,255,255,0.15) 150px, 
                rgba(255,255,255,0.15) 153px
            );
            animation: windRush 0.3s linear infinite;
            pointer-events: none;
        }

        @keyframes windRush {
            from { transform: translateX(0) translateY(0); }
            to { transform: translateX(-40px) translateY(40px); }
        }
    </style>
</head>
<body>
    <header>
        <h1>Лабораторна робота №6</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Повернутися на Головну</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h2>Анімація: "Пікірування Hawlucha"</h2>
            <div class="animation-scene">
                <div class="celestial-body"></div>
                <div class="mountains"></div>
                <div class="clouds-layer clouds-back"></div>
                <div class="clouds-layer clouds-front"></div>
                <div class="speed-lines"></div>
                <div class="pokemon-diving"></div>
            </div>
        </section>
    </main>
</body>
</html>
