<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №4 - Weekly Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Oswald:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e9ecef;
            font-family: 'Roboto', sans-serif;
            color: #2b2b2b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-nav {
            margin-bottom: 15px;
            width: 100%;
            max-width: 1100px;
        }

        .back-nav a {
            text-decoration: none;
            color: #495057;
            font-weight: 500;
        }

        .back-nav a:hover {
            color: #000;
            text-decoration: underline;
        }

   
        .planner-container {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border: 2px solid #555;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            padding: 15px 25px 20px;
            min-height: 80vh;
        }

   
        .planner-header {
            display: grid;
            grid-template-columns: 260px 1fr 1fr 180px;
            align-items: end;
            gap: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #333;
        }

        .planner-title {
            font-family: 'Oswald', sans-serif;
            font-size: 38px;
            letter-spacing: 1.5px;
            line-height: 1;
            text-transform: uppercase;
        }

        .header-field {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .header-field label {
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .header-field input {
            border: none;
            border-bottom: 1px solid #777;
            outline: none;
            width: 100%;
            font-family: 'Caveat', cursive;
            font-size: 19px;
            padding: 0 5px;
            background: transparent;
        }

        .habit-feedback {
            font-family: 'Oswald', sans-serif;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .habit-feedback label {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            cursor: pointer;
        }

 
        .planner-grid {
            display: grid;
            grid-template-columns: 260px repeat(3, 1fr);
            grid-template-rows: repeat(2, minmax(280px, auto));
            border-bottom: 3px solid #777;
        }

        .todo-column {
            grid-row: 1 / 3;
            border-right: 2px solid #333;
            padding: 10px 14px 10px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .todo-section-title {
            font-family: 'Oswald', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .todo-item input[type="checkbox"],
        .day-header input[type="checkbox"],
        .habit-feedback input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #333;
            cursor: pointer;
        }

        .todo-item input[type="text"] {
            flex: 1;
            border: none;
            border-bottom: 1px solid #cfcfcf;
            font-family: 'Caveat', cursive;
            font-size: 18px;
            color: #111;
            outline: none;
            background: transparent;
            padding: 2px 4px;
        }

        .todo-item input[type="text"]:focus {
            border-bottom-color: #000;
        }

      
        .day-box {
            border-right: 1px solid #444;
            border-bottom: 1px solid #444;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .day-box:nth-child(4),
        .day-box:nth-child(7) {
            border-right: none;
        }

        .day-box.bottom-row {
            border-bottom: none;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
            margin-bottom: 6px;
        }

        .day-header .day-title {
            font-family: 'Oswald', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .day-notes {
            flex: 1;
            width: 100%;
            border: none;
            resize: none;
            outline: none;
            font-family: 'Caveat', cursive;
            font-size: 18px;
            line-height: 28px;
            background-image: repeating-linear-gradient(transparent, transparent 27px, #e9ecef 28px);
            background-attachment: local;
            color: #222;
        }

     
        .weekend-box {
            display: flex;
            flex-direction: column;
            padding: 0;
            border-bottom: none;
        }

        .half-day {
            flex: 1;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
        }

        .half-day:first-child {
            border-bottom: 1px solid #444;
        }

     
        @media (max-width: 900px) {
            .planner-header {
                grid-template-columns: 1fr 1fr;
            }
            .planner-grid {
                grid-template-columns: 220px repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <nav class="back-nav">
        <a href="../index.html">← Повернутися на головну</a>
    </nav>

    <div class="planner-container">
    
        <header class="planner-header">
            <h1 class="planner-title">Weekly Plan</h1>
            <div class="header-field">
                <label for="week-of">WEEK OF</label>
                <input type="text" id="week-of" placeholder="Вкажіть дату...">
            </div>
            <div class="header-field">
                <label for="healthy-habit">HEALTHY HABIT</label>
                <input type="text" id="healthy-habit" placeholder="Наприклад, 2л води на день">
            </div>
            <div class="habit-feedback">
                <label><input type="checkbox"> ROCKED IT</label>
                <label><input type="checkbox"> ROOM FOR IMPROVEMENT</label>
            </div>
        </header>

     
        <main class="planner-grid">
   
            <section class="todo-column">
                <div class="todo-group">
                    <h2 class="todo-section-title">Top 3 Goals</h2>
                    <div class="todo-list">
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                    </div>
                </div>

                <div class="todo-group">
                    <h2 class="todo-section-title">Everything Else</h2>
                    <div class="todo-list">
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                    </div>
                </div>

                <div class="todo-group">
                    <h2 class="todo-section-title">Next Week</h2>
                    <div class="todo-list">
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                        <div class="todo-item"><input type="checkbox"><input type="text"></div>
                    </div>
                </div>
            </section>

           
            <section class="day-box">
                <div class="day-header">
                    <span class="day-title">Monday</span>
                    <input type="checkbox">
                </div>
                <textarea class="day-notes" placeholder="Нотатки..."></textarea>
            </section>

            
            <section class="day-box">
                <div class="day-header">
                    <span class="day-title">Tuesday</span>
                    <input type="checkbox">
                </div>
                <textarea class="day-notes" placeholder="Нотатки..."></textarea>
            </section>

           
            <section class="day-box">
                <div class="day-header">
                    <span class="day-title">Wednesday</span>
                    <input type="checkbox">
                </div>
                <textarea class="day-notes" placeholder="Нотатки..."></textarea>
            </section>

        
            <section class="day-box bottom-row">
                <div class="day-header">
                    <span class="day-title">Thursday</span>
                    <input type="checkbox">
                </div>
                <textarea class="day-notes" placeholder="Нотатки..."></textarea>
            </section>

            <section class="day-box bottom-row">
                <div class="day-header">
                    <span class="day-title">Friday</span>
                    <input type="checkbox">
                </div>
                <textarea class="day-notes" placeholder="Нотатки..."></textarea>
            </section>

            
            <section class="day-box bottom-row weekend-box">
                <div class="half-day">
                    <div class="day-header">
                        <span class="day-title">Saturday</span>
                        <input type="checkbox">
                    </div>
                    <textarea class="day-notes" placeholder="Нотатки..."></textarea>
                </div>
                <div class="half-day">
                    <div class="day-header">
                        <span class="day-title">Sunday</span>
                        <input type="checkbox">
                    </div>
                    <textarea class="day-notes" placeholder="Нотатки..."></textarea>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
